[package]
name = "monopoly-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "monopoly"
path = "src/main.rs"

[dependencies]
monopoly-engine = { path = "../engine" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
