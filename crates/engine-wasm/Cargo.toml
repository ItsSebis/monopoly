[package]
name = "monopoly-engine-wasm"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
monopoly-engine = { path = "../engine" }
wasm-bindgen = "0.2"
serde_json = "1"
console_error_panic_hook = "0.1"
# `engine`'s use of `rand` pulls in `getrandom` transitively, which has no
# default entropy source on wasm32-unknown-unknown - the "js" feature routes
# it through the browser's crypto API instead. Declared here (not in
# `engine`, which stays platform-agnostic) since only the wasm build needs it.
getrandom = { version = "0.2", features = ["js"] }
