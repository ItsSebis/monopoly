[rules]
starting_cash = 1500
go_salary = 200
jail_fine = 50
luxury_tax = 75
# A "kitchen sink" casual variant combining every optional house rule this
# engine supports, none of which are official Monopoly rules (see
# docs/game-rules.md's Free parking / Double GO salary / Unlimited houses
# sections) - useful as a quick way to confirm they compose correctly with
# each other, or as a starting point for a house-rules-heavy family game.
free_parking_pot = true
double_go_salary = true
unlimited_houses = true

[rules.income_tax_mode]
mode = "flat"
amount = 200

[[players]]
name = "Alice"
strategy = "buy_all"

[[players]]
name = "Bob"
strategy = "buy_good"
